name: monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Conferir site e API
        id: check
        run: |
          ok() {
            site=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://titaaraujo.com.br/ || true)
            # a API responde 401 sem login; qualquer resposta abaixo de 500 = no ar
            api=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://titaaraujo.com.br/api/auth/me || true)
            echo "site=$site api=$api"
            [ "$site" = 200 ] && [ "$api" -ge 200 ] 2>/dev/null && [ "$api" -lt 500 ]
          }
          # 3 tentativas com 30s entre elas para não alarmar por uma oscilação
          for i in 1 2 3; do
            if ok; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            [ $i -lt 3 ] && sleep 30
          done
          echo "up=false" >> "$GITHUB_OUTPUT"

      - name: Abrir ou fechar o aviso
        env:
          GH_TOKEN: ${{ github.token }}
          UP: ${{ steps.check.outputs.up }}
        run: |
          now=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')
          open=$(gh issue list --label fora-do-ar --state open --json number -q '.[0].number')
          git config user.name 'monitor'
          git config user.email 'monitor@users.noreply.github.com'
          if [ "$UP" = false ] && [ -z "$open" ]; then
            gh label create fora-do-ar --color B60205 2>/dev/null || true
            gh issue create --label fora-do-ar --title "titaaraujo.com.br fora do ar desde $now" \
              --body "O monitor não conseguiu abrir o site ou a API em 3 tentativas seguidas (horário de Brasília: $now). A issue fecha sozinha quando voltar."
            echo "- $now · caiu" >> historico.md
          elif [ "$UP" = true ] && [ -n "$open" ]; then
            gh issue comment "$open" --body "Voltou ao ar em $now."
            gh issue close "$open"
            echo "- $now · voltou" >> historico.md
          fi
          # o GitHub desliga agendamentos de repositório parado há 60 dias; um commit por mês evita isso
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then echo "$now" > .ultimo-sinal; fi
          if [ -n "$(git status --porcelain)" ]; then git add -A && git commit -qm "monitor: $now" && git push -q; fi
          [ "$UP" = true ]
